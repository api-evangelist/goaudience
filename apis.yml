name: GoAudience
description: >-
  GoAudience is a customer-intelligence platform for Shopify ecommerce brands that turns first-party
  customer data into marketing decisions. It builds stable customer personas from real store data,
  surfaces findings and recommended actions ranked by impact, and syncs directly into Klaviyo, Meta,
  TikTok and other marketing tools. Features include a natural-language command surface for asking
  grounded questions about customers, a weekly "Monday Brief" digest of at-risk, lapsed and recovered
  customers with revenue impact, and a 90-day email audit. GoAudience is a Techstars-backed company;
  this profile was added to the API Evangelist network as an enrichment lead.
